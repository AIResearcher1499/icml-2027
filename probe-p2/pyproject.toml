[project]
name = "weighttraces"
version = "0.1.0"
description = "72h kill probe for P2 (weights over traces). Dummy/smoke never lock."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
hf = [
    "datasets>=3.0.0",
]
gpu = [
    "torch>=2.4.0",
    "transformers>=4.51.0",
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
weighttraces = "weighttraces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ layout: weighttraces lives at src/weighttraces

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
