[project]
name = "scratchdepth"
version = "0.1.0"
description = "72h kill probe for P3 (serial-depth prosthesis). Dummy never locks."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
scratchdepth = "scratchdepth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ layout: scratchdepth lives at src/scratchdepth

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
