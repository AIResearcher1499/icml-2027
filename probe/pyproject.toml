[project]
name = "accesstrap"
version = "0.1.0"
description = "72h kill probe for the Access Trap (sharpened P1)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
hf = [
    "datasets>=3.0.0",
]
gpu = [
    "torch>=2.4.0",
    "transformers>=4.51.0",
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
accesstrap = "accesstrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ layout: accesstrap lives at src/accesstrap

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
